[package]
name = "my-music-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = "1.0.160"
serde_json = "1.0.96"
serenity = { version = "0.12.2", features = [
    "cache",
    "client",
    "standard_framework",
    "rustls_backend",
] }
tokio = { version = "1.28.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tracing = "0.1.37"
tracing-subscriber = "0.3.18"
tracing-futures = "0.2.5"

songbird = { version = "0.4.3", features = ["builtin-queue"] }
poise = { version = "0.6.1", default-features = false, features = ["cache"] }
reqwest = "0.11"
symphonia = { version = "0.5.2", features = ["aac", "mp3", "isomp4", "alac"] }
